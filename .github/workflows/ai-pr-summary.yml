name: Gemini PR Summary

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install New Google GenAI
        run: pip install -q -U google-genai

      - name: Generate Summary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git diff origin/main...HEAD > pr_diff.txt
          
          python3 << 'EOF'
          import os
          from google import genai
          from google.genai import types

          try:
              client = genai.Client(
                  api_key=os.environ["GEMINI_API_KEY"],
                  http_options={'api_version': 'v1'}
              )
              
              with open('pr_diff.txt', 'r') as f:
                  diff_text = f.read()[:15000]

              prompt = f"""Você é um Engenheiro de QA Sênior especializado em Robot Framework e Clean Code.
                          Sua tarefa é analisar o DIFF de código fornecido e gerar um resumo técnico detalhado para um Pull Request.
                          Em cenários que houve a mesma alteraçao para diversas partes do código compacte essas alterações em um único item, evitando repetições desnecessárias. 
                          Use o seguinte formato de resposta:

                          ## 📝 Resumo Geral
                          (Descreva em uma frase curta o objetivo principal desta alteração)

                          ## 🤖 Alterações em Robot Framework
                          Separe por arquivos:

                          ### 📂 Arquivo: [Caminho do Arquivo]
                          - **Cenários de Teste (Test Cases):**
                            * ✅ [Novo] Nome do teste adicionado.
                            * 🔄 [Alterado] Nome do teste e o que mudou na lógica.
  
                          - **Keywords e Parâmetros:**
                            * 🛠️ **Nome da Keyword**:
                              - Status: (Nova / Alterada / Removida)
                              - Parâmetros Atuais: `[lista de parâmetros]`
                              - Mudança: (Ex: "Adicionado parâmetro item", "Removido valor padrão")

                          ## 📦 Dependências e Infraestrutura
                          - Relate alterações em `requirements.txt`, arquivos `.py` auxiliares ou variáveis de ambiente.

                          ## ⚠️ Observações e Sugestões (Opcional)
                          - Aponte possíveis bugs, falta de documentação [Documentation] ou violações de boas práticas.

                          ---
                          Instruções Adicionais:
                          1. Ignore mudanças em espaços em branco ou comentários irrelevantes.
                          2. Se uma Keyword teve o nome alterado, identifique o De/Para.
                          3. Responda estritamente em Português (Brasil).

                          DIFF PARA ANÁLISE:
                          ${diff_text}"""
              
              # Configuração para evitar bloqueios de segurança que causam erros estranhos
              config = types.GenerateContentConfig(
                  temperature=0.2,
                  top_p=0.95,
                  top_k=40,
                  max_output_tokens=8192,
              )

              response = client.models.generate_content(
                  model='gemini-2.5-flash', 
                  contents=prompt,
                  config=config
              )
              
              with open('summary.md', 'w') as out:
                  if response.text:
                      out.write("### 🤖 Resumo Automático (Gemini)\n\n" + response.text)
                  else:
                      out.write("### 🤖 Resumo Automático (Gemini)\n\n⚠️ O modelo retornou uma resposta vazia.")
                      
          except Exception as e:
              with open('summary.md', 'w') as out:
                  out.write(f"### 🤖 Resumo Automático (Gemini)\n\n⚠️ Erro na requisição: {str(e)}")
          EOF

      - name: Post Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
          COMMENT_BODY=$(cat summary.md)
          
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments \
            -d "{\"body\": $(echo "$COMMENT_BODY" | jq -Rs .)}"